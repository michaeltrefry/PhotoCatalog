name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  OMP_NUM_THREADS: '1'
  PHOTOCATALOG_DNG_SDK: ${{ github.workspace }}/.deps/dng_sdk_1_7_1_2724/dng_sdk_1_7_1

jobs:
  benchmark-contract:
    name: Benchmark evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned benchmark bindings
        run: |
          python -m pip install --only-binary=:all: -r benchmarks/requirements.txt -r scripts/edit-requirements.txt
      - name: Check small benchmark and telemetry fixtures
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
      - name: Check preview evidence contracts without running campaigns
        run: python -m unittest discover -s scripts -p 'test_preview*.py' -v
      - name: Check editing pixels and evidence contracts without running campaigns
        env:
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: python -m unittest discover -s scripts -p 'test_edit_*.py' -v
      - name: Check desktop packaging dependency contracts
        run: python -m unittest discover -s scripts -p test_package_desktop.py -v
      - name: Check desktop staging, wrapper, and notice fixtures
        run: |
          python -m unittest discover -s scripts -p 'test_desktop*.py' -v
          python -m unittest discover -s scripts -p 'test_collect_desktop_notices.py' -v
          python -m unittest discover -s scripts -p 'test_installed_worker_smoke.py' -v
      - name: Check private Lightroom runner fixtures
        run: python -m unittest discover -s tests -p 'test_lightroom_*.py' -v

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 90 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native image libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libavif-dev libjpeg-dev libwebp-dev zlib1g-dev pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install native image libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw libavif jpeg-xl webp pkgconf
      - name: Check out pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          path: .vcpkg
      - name: Identify Windows runner image for native cache
        if: runner.os == 'Windows'
        id: windows-runner-image
        shell: pwsh
        run: |
          foreach ($value in @($env:ImageOS, $env:ImageVersion)) {
            if ([string]::IsNullOrWhiteSpace($value) -or $value -notmatch '^[A-Za-z0-9._-]+$') {
              throw "Missing or invalid hosted runner image identity"
            }
          }
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore native image libraries (Windows)
        if: runner.os == 'Windows'
        id: windows-native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg/installed
          key: windows-${{ steps.windows-runner-image.outputs.image }}-x64-static-md-vcpkg-04a9d8e-${{ hashFiles('vcpkg.json') }}
      - name: Install native image libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.vcpkg/vcpkg.exe install --triplet x64-windows-static-md --x-manifest-root="$env:GITHUB_WORKSPACE" --x-install-root="$env:GITHUB_WORKSPACE/.vcpkg/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/.vcpkg" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
      # Preserve a successful cold build even if a later Rust check fails.
      - name: Save native image libraries (Windows)
        if: runner.os == 'Windows' && steps.windows-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg/installed
          key: ${{ steps.windows-native-cache.outputs.cache-primary-key }}
      - name: Install repository toolchain
        shell: bash
        run: rustup show
      - name: Cache verified DNG SDK source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps
          key: ${{ runner.os }}-${{ runner.arch }}-dng-sdk-2724-740fbe95-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Fetch and verify pinned DNG SDK
        run: python scripts/fetch_dng_sdk.py --destination .deps
      - name: Build bundled JPEG XL for DNG compatibility (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S "$PHOTOCATALOG_DNG_SDK/libjxl/libjxl" -B .deps/jxl-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.deps/jxl" \
            -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_DEVTOOLS=OFF \
            -DJPEGXL_ENABLE_JPEGLI=OFF -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_BENCHMARK=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_JNI=OFF -DJPEGXL_ENABLE_SJPEG=OFF -DJPEGXL_ENABLE_OPENEXR=OFF
          cmake --build .deps/jxl-build --parallel 4
          cmake --install .deps/jxl-build
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.deps/jxl/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.deps/jxl/lib" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'build.rs', 'vcpkg.json', 'scripts/fetch_dng_sdk.py') }}
      - name: Check formatting
        # Published vendor sources retain upstream formatting and omit upstream tests.
        run: cargo fmt --package photocatalog --check
      - name: Test corpus evidence rejection
        run: python -m unittest discover -s scripts -p test_validate_image_corpus.py -v
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test library and CLI, including restart and recovery
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Validate native same-device file bind mount cache boundary (Linux)
        if: runner.os == 'Linux'
        run: python scripts/validate_linux_bind_mount.py
      - name: Validate native volume GUID and junction mapping (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate_windows_volume.ps1
      - name: Build CLI and full-resolution validation probe
        run: cargo build --locked --bins --examples
      - name: Validate public CC0 Canon and Panasonic RAW originals
        run: python scripts/validate_public_raw.py --probe "target/debug/examples/render_probe${{ runner.os == 'Windows' && '.exe' || '' }}"

      # Desktop stays in the existing OS lane and reuses its exact native SDK,
      # vcpkg, pkg-config and Cargo caches. No separate workflow fanout.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned process observer bindings
        run: |
          python -m pip install --only-binary=:all: -r scripts/edit-requirements.txt
      - name: Install locked desktop dependencies and check frontend
        run: |
          python scripts/desktop_tool.py --desktop desktop install
          python scripts/desktop_tool.py --desktop desktop frontend-test
          python scripts/desktop_tool.py --desktop desktop frontend-build
      - name: Locate Windows import inspector and redistributable sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio installation missing' }
          "DESKTOP_VS=$vs" >> $env:GITHUB_ENV
          $llvm = 'C:/Program Files/LLVM/bin'
          if (!(Test-Path "$llvm/llvm-readobj.exe")) {
            choco install llvm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path "$llvm/llvm-readobj.exe")) { throw 'LLVM import inspector missing' }
          $llvm >> $env:GITHUB_PATH
      - name: Build locked Tauri executable without installer or release credentials
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            export RUSTFLAGS='-C link-arg=-Wl,-headerpad_max_install_names'
          fi
          python scripts/desktop_tool.py --desktop desktop build
      - name: Build synthetic installed-worker observation tool
        run: cargo build --locked --release --example desktop_worker_smoke
      - name: Stage native payload and collect platform-specific notices
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-evidence"
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            python scripts/desktop_ci_stage.py --platform linux --executable target/release/photocatalog-desktop --sdk "$PHOTOCATALOG_DNG_SDK" --jxl-prefix .deps/jxl --output "$RUNNER_TEMP/desktop-stage"
            args=(--native-input "$RUNNER_TEMP/desktop-stage/native-notices/manifest.json")
          elif [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/desktop_ci_stage.py --platform windows --executable target/release/photocatalog-desktop.exe --sdk "$PHOTOCATALOG_DNG_SDK" --vcpkg .vcpkg --visual-studio "$DESKTOP_VS" --output "$RUNNER_TEMP/desktop-stage"
            args=(--native-input "$RUNNER_TEMP/desktop-stage/native-notices/manifest.json")
          else
            args=(--brew "$(brew --prefix)")
          fi
          python scripts/collect_desktop_notices.py --checkout . --sdk "$PHOTOCATALOG_DNG_SDK" --rust-sysroot "$(rustc --print sysroot)" --output "$RUNNER_TEMP/desktop-notices" --fetch "${args[@]}"
      - name: Package, inspect installed payload, and prove worker execution outside checkout
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          platform=linux; suffix=''
          if [[ "$RUNNER_OS" == macOS ]]; then platform=macos; fi
          if [[ "$RUNNER_OS" == Windows ]]; then platform=windows; suffix=.exe; fi
          python scripts/desktop_ci_package.py --platform "$platform" --checkout . --target target --stage "$RUNNER_TEMP/desktop-stage" --notices "$RUNNER_TEMP/desktop-notices" --probe "target/release/examples/desktop_worker_smoke$suffix" --output "$RUNNER_TEMP/desktop-evidence/package"
      - name: Preserve installer and qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/desktop-evidence
            ${{ runner.temp }}/desktop-stage
            ${{ runner.temp }}/desktop-notices
