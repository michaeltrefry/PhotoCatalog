name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  OMP_NUM_THREADS: '1'
  PHOTOCATALOG_DNG_SDK: ${{ github.workspace }}/.deps/dng_sdk_1_7_1_2724/dng_sdk_1_7_1

jobs:
  benchmark-contract:
    name: Benchmark evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned benchmark bindings
        run: |
          python -m pip install --only-binary=:all: -r benchmarks/requirements.txt
      - name: Check small benchmark and telemetry fixtures
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 40 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native image libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev libavif-dev libjpeg-dev zlib1g-dev pkg-config
      - name: Install native image libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw libavif jpeg-xl pkgconf
      - name: Check out pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4
          path: .vcpkg
      - name: Identify Windows runner image for native cache
        if: runner.os == 'Windows'
        id: windows-runner-image
        shell: pwsh
        run: |
          foreach ($value in @($env:ImageOS, $env:ImageVersion)) {
            if ([string]::IsNullOrWhiteSpace($value) -or $value -notmatch '^[A-Za-z0-9._-]+$') {
              throw "Missing or invalid hosted runner image identity"
            }
          }
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore native image libraries (Windows)
        if: runner.os == 'Windows'
        id: windows-native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg/installed
          key: windows-${{ steps.windows-runner-image.outputs.image }}-x64-static-md-vcpkg-04a9d8e-${{ hashFiles('vcpkg.json') }}
      - name: Install native image libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.vcpkg/vcpkg.exe install --triplet x64-windows-static-md --x-manifest-root="$env:GITHUB_WORKSPACE" --x-install-root="$env:GITHUB_WORKSPACE/.vcpkg/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/.vcpkg" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
      # Preserve a successful cold build even if a later Rust check fails.
      - name: Save native image libraries (Windows)
        if: runner.os == 'Windows' && steps.windows-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg/installed
          key: ${{ steps.windows-native-cache.outputs.cache-primary-key }}
      - name: Install repository toolchain
        shell: bash
        run: rustup show
      - name: Cache verified DNG SDK source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps
          key: ${{ runner.os }}-${{ runner.arch }}-dng-sdk-2724-740fbe95-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Fetch and verify pinned DNG SDK
        run: python scripts/fetch_dng_sdk.py --destination .deps
      - name: Build bundled JPEG XL for DNG compatibility (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S "$PHOTOCATALOG_DNG_SDK/libjxl/libjxl" -B .deps/jxl-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.deps/jxl" \
            -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_DEVTOOLS=OFF \
            -DJPEGXL_ENABLE_JPEGLI=OFF -DJPEGXL_ENABLE_JPEGLI_LIBJPEG=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_BENCHMARK=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_JNI=OFF -DJPEGXL_ENABLE_SJPEG=OFF -DJPEGXL_ENABLE_OPENEXR=OFF
          cmake --build .deps/jxl-build --parallel 4
          cmake --install .deps/jxl-build
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.deps/jxl/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.deps/jxl/lib" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'build.rs', 'vcpkg.json', 'scripts/fetch_dng_sdk.py') }}
      - name: Check formatting
        # Published vendor sources retain upstream formatting and omit upstream tests.
        run: cargo fmt --package photocatalog --check
      - name: Test corpus evidence rejection
        run: python -m unittest discover -s scripts -p test_validate_image_corpus.py -v
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test library and CLI, including restart and recovery
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Validate native same-device file bind mount cache boundary (Linux)
        if: runner.os == 'Linux'
        run: python scripts/validate_linux_bind_mount.py
      - name: Validate native volume GUID and junction mapping (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate_windows_volume.ps1
      - name: Build CLI and full-resolution validation probe
        run: cargo build --locked --bins --examples
      - name: Validate public CC0 Canon and Panasonic RAW originals
        run: python scripts/validate_public_raw.py --probe "target/debug/examples/render_probe${{ runner.os == 'Windows' && '.exe' || '' }}"
