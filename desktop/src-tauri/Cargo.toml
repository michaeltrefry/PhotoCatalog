[package]
name = "photocatalog-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
photocatalog = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Explicit measurement packages only; ordinary release builds remain uninspectable.
measurement-devtools = ["tauri/devtools"]

[patch.crates-io]
libsqlite3-sys = { path = "../../vendor/libsqlite3-sys" }
