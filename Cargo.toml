[package]
name = "photocatalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
lcms2 = { version = "6", features = ["static"] }
flate2 = "1"
png = "=0.18.1"
tiff = "=0.10.3"
kamadak-exif = "0.6"
rusqlite = { version = "0.38", features = ["bundled", "hooks", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
xmp_toolkit = { version = "=1.12.1", path = "vendor/xmp_toolkit", features = ["source-preservation"] }
md5 = "=0.8.0"
roxmltree = "=0.21.1"
libc = "0.2"

[build-dependencies]
blake3 = "1"
cc = "1"
pkg-config = "0.3"
vcpkg = "0.2"

[dev-dependencies]
assert_cmd = "2"
